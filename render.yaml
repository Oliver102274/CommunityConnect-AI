# Render Blueprint for CommunityConnect AI (Free web service).
# Secrets are NOT stored here: values marked `sync: false` are entered in the
# Render dashboard when the Blueprint is created.
services:
  - type: web
    name: communityconnect-ai
    runtime: python
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 90
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SNOWFLAKE_ACCOUNT
        sync: false
      - key: SNOWFLAKE_USER
        sync: false
      - key: SNOWFLAKE_PRIVATE_KEY
        sync: false
      - key: SNOWFLAKE_ROLE
        value: COMMUNITYCONNECT_APP_ROLE
      - key: SNOWFLAKE_WAREHOUSE
        value: COMPUTE_WH
      - key: SNOWFLAKE_DATABASE
        value: COMMUNITYCONNECT_DB
      - key: SNOWFLAKE_SCHEMA
        value: PUBLIC
      - key: PUBLIC_SITE_URL
        sync: false
